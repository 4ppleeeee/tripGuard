#Gradle
org.gradle.jvmargs=-Xmx16G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
# 避免 release 构建阶段（D8/R8）并发过高触发 OOM
org.gradle.workers.max=2
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
ksp.incremental=false

mavenUrl=https://mirrors.tencent.com/repository/maven/thirdparty

kotlin.native.cacheKind.ohosArm64=none
android.injected.testOnly=false
# 关闭 Compose Multiplatform 对 iOS podspec resources 的自动管理，
# 使用 QNKmmMainPlugin 中 extraSpecAttributes["resources"] 的自定义路径
compose.ios.resources.sync=false

org.gradle.logging.level=warn
