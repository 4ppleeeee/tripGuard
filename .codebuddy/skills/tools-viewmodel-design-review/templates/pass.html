<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewModel 设计审查报告 - 通过</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #26a69a 0%, #00897b 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header .summary { font-size: 16px; opacity: 0.9; }
        .header .disclaimer {
            margin: 14px auto 0;
            display: inline-block;
            max-width: 980px;
            background: #ffffff;
            color: #cf1322;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .content { padding: 30px; }
        .info-card { border: 1px solid #e0e0e0; border-left: 4px solid #26a69a; border-radius: 6px; margin-bottom: 24px; background: #fff; }
        .info-header { padding: 16px 20px; background: #e0f2f1; border-bottom: 1px solid #b2dfdb; }
        .info-title { font-size: 18px; font-weight: 600; color: #00695c; }
        .info-body { padding: 20px; }
        .info-section { margin-bottom: 16px; }
        .info-section:last-child { margin-bottom: 0; }
        .info-label { font-weight: 600; color: #666; margin-bottom: 8px; font-size: 14px; }
        .info-text { color: #666; line-height: 1.8; }
        .info-text ul { padding-left: 20px; margin-top: 8px; }
        .info-text li { margin-bottom: 4px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; background: #26a69a; color: white; }
        .score { font-size: 36px; font-weight: 700; color: #00897b; }
        .footer { background: #f8f9fa; padding: 20px 30px; text-align: center; color: #666; font-size: 14px; border-top: 1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✅ ViewModel 设计审查通过</h1>
            <div class="summary">{{HEADER_SUMMARY}}</div>
            <div class="disclaimer"><strong>AI检查的问题不代表一定错误，具有模糊性，流水线卡住时应该找架构师讨论，“流水线挂了一定错”在AI模式下不适用。</strong></div>
        </div>
        <div class="content">
            <div class="info-card">
                <div class="info-header"><div class="info-title">审查结论</div></div>
                <div class="info-body">
                    <div class="info-section">
                        <div class="info-label">📋 判定结果</div>
                        <div class="info-text"><span class="badge">通过</span>&nbsp;&nbsp;总分：<span class="score">{{SCORE}}</span>/100</div>
                    </div>
                </div>
            </div>
            <div class="info-card">
                <div class="info-header"><div class="info-title">审查范围</div></div>
                <div class="info-body">{{REVIEW_SCOPE}}</div>
            </div>
            <div class="info-card">
                <div class="info-header"><div class="info-title">通过依据</div></div>
                <div class="info-body">{{PASS_REASONS}}</div>
            </div>
            <div class="info-card">
                <div class="info-header"><div class="info-title">已复核修改点</div></div>
                <div class="info-body">{{REVIEWED_CHANGES}}</div>
            </div>
        </div>
        <div class="footer">
            <p>📋 详细审查报告：<a href="./ViewModel-design-report.md">ViewModel-design-report.md</a></p>
            <p style="margin-top: 8px;">审查时间：{{REVIEW_TIME}} | 审查模式：{{REVIEW_MODE}}</p>
        </div>
    </div>
</body>
</html>
